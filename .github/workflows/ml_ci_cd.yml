name: ML heart-model

on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ml_ci_cd]

jobs:
  ml_ci_cd:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v3

       - name: Set up Python
         uses: actions/setup-python@v4
         with:
           python-version: '3.10'

       - name: Install dependencies
         run: pip install -r requirements.txt

       - name: Download dataset
         run: |
           mkdir -p data
           wget -O data/creditcard.csv "${{ github.event.client_payload.dataseturl }}"

       - name: Train model
         run: python train.py

       - name: Docker login
         uses: docker/login-action@v2
         with:
           username: ${{ secrets.DOCKER_USER }}
           password: ${{ secrets.DOCKER_PASSWORD }}

       - name: Build and push Docker image
         run: |
           TAG="${{ github.event.client_payload.sha }}"
           docker build -t ${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:$TAG .
           docker push ${{ secrets.DOCKER_USER }}/${{ secrets.MODEL_NAME }}:$TAG
